name: Finalize pc8 observed metadata

on:
  push:
    branches:
      - codex/b13-ranking-penalty

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pc8-meta]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b13-ranking-penalty
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Move observed metadata attachment after all candidate generation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('theory.js')
          s = p.read_text()
          block = '''  // Every candidate keeps the exact observed pitch set even when its local
          // harmonic spelling/ranking differs. Consumers must not reconstruct this.
          for (var oi = 0; oi < candidates.length; oi++) {
            candidates[oi].observedPCS = pcs.slice();
            candidates[oi].observedPitchClasses = pcs.slice();
            candidates[oi].observedBassPC = lowestPC;
          }

          '''
          if s.count(block) != 1:
              raise SystemExit(f'expected one observed metadata block, got {s.count(block)}')
          s = s.replace(block, '', 1)
          anchor = "  pinB7HybridNearTop('', 2);\n  pinB7HybridNearTop('m', 1);\n  return candidates.slice(0, 8);\n"
          replacement = "  pinB7HybridNearTop('', 2);\n  pinB7HybridNearTop('m', 1);\n\n" + block + "  return candidates.slice(0, 8);\n"
          if anchor not in s:
              raise SystemExit('final return anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          p = Path('tests/pc8-harmonic-semantics.test.js')
          s = p.read_text()
          anchor = "  it('parses explicit b6 separately from seventh-chord b13', () => {\n"
          test = "  it('attaches the exact observation to every returned candidate, including late hybrid candidates', () => {\n    const notes = [60, 62, 65, 70]; // C D F Bb; exercises late b7-over-bass hybrid pinning\n    const expected = [0, 2, 5, 10];\n    const results = padDetectChord(notes);\n    expect(results.length).toBeGreaterThan(0);\n    for (const candidate of results) {\n      expect(candidate.observedPCS).toEqual(expected);\n      expect(candidate.observedPitchClasses).toEqual(expected);\n      expect(candidate.observedBassPC).toBe(0);\n    }\n  });\n\n"
          if anchor not in s:
              raise SystemExit('test insertion anchor not found')
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- theory.js tests/pc8-harmonic-semantics.test.js
      - name: Verify focused and full suite
        run: |
          npm ci
          npx vitest run tests/pc8-harmonic-semantics.test.js
          npm test
      - name: Commit
        run: |
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add theory.js tests/pc8-harmonic-semantics.test.js
          git commit -m 'test(theory): attach observed set after candidate finalization [pc8-meta]'
          git push origin HEAD:codex/b13-ranking-penalty
