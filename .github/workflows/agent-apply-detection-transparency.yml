name: Agent detection transparency patch

on:
  push:
    branches:
      - agent/v17-detection-transparency
    paths:
      - .github/workflows/agent-apply-detection-transparency.yml
      - scripts/apply-detection-transparency.cjs

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply transparency patch
        run: node scripts/apply-detection-transparency.cjs
      - name: Run full pad-core suite
        run: npm test
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theory.js tests/theory.test.js tests/v17-detection-transparency.test.js
          git diff --cached --check
          git commit -m "fix(theory): make chord detection transparent"
          git push origin HEAD:agent/v17-detection-transparency
