name: Agent detection transparency self-review

on:
  push:
    branches:
      - agent/v17-detection-transparency
    paths:
      - .github/workflows/agent-selfreview-detection-transparency.yml

permissions:
  contents: write

jobs:
  self-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix reviewed indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('theory.js')
          text = path.read_text()
          old = "          if (matched === omit5pcs.length) {\n                var extra = pcs.length - omit5pcs.length;"
          new = "          if (matched === omit5pcs.length) {\n            var extra = pcs.length - omit5pcs.length;"
          if old not in text:
              raise SystemExit('reviewed indentation target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify dominant slash survives bass-shell context
        run: |
          cat > tests/_selfreview-detection-transparency.test.js <<'EOF'
          import { it, expect } from 'vitest';

          it('retains a dominant slash candidate over an observed bass shell', () => {
            const notes = [48, 52, 55, 58, 59, 62, 65]; // C E G Bb B D F
            const candidates = padDetectChord(notes);
            const gDominantOverC = candidates.find(candidate =>
              candidate.rootPC === 7 && candidate.name.startsWith('G7') && candidate.name.includes(' / C')
            );
            expect(gDominantOverC).toBeTruthy();
            const observed = [0, 2, 4, 5, 7, 10, 11];
            expect(gDominantOverC.observedPCS).toEqual(observed);
          });
          EOF
          npx vitest run tests/_selfreview-detection-transparency.test.js
          rm tests/_selfreview-detection-transparency.test.js
      - name: Re-run full suite
        run: npm test
      - name: Commit review fix and remove temporary workflow
        run: |
          rm -f .github/workflows/agent-selfreview-detection-transparency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(theory): clean detection transparency patch"
          git push origin HEAD:agent/v17-detection-transparency
