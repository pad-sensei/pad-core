name: Agent detection transparency self-review

on:
  push:
    branches:
      - agent/v17-detection-transparency
    paths:
      - .github/workflows/agent-selfreview-detection-transparency.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print dominant-over-shell candidate ranking
        run: |
          cat > tests/_selfreview-detection-transparency.test.js <<'EOF'
          import { it, expect } from 'vitest';

          it('prints dominant slash candidates over bass shell', () => {
            const fixtures = [
              [48, 52, 55, 58, 59, 62, 65], // C E G Bb B D F
              [48, 52, 58, 59, 62, 65],     // C E Bb B D F (rootless G7 upper structure)
              [48, 52, 58, 55, 59, 62, 65],
            ];
            for (const notes of fixtures) {
              const candidates = padDetectChord(notes);
              console.log('FIXTURE', notes.join(','));
              console.log(candidates.map(c => `${c.score}: ${c.name} [root=${c.rootPC}]`).join('\n'));
            }
            expect(true).toBe(true);
          });
          EOF
          npx vitest run tests/_selfreview-detection-transparency.test.js --reporter=verbose
          rm tests/_selfreview-detection-transparency.test.js
