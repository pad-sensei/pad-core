name: Verify v1.8.1 altered dominant resolution

on:
  push:
    branches:
      - codex/v181-altered-dominant-resolution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-altered-dominant-resolution
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused regression
        run: npx vitest run tests/altered-dominant-resolution.test.js
      - name: Full suite
        run: npm test
      - name: Clean diff
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
