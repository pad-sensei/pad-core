name: Verify v1.8.1 altered dominant resolution

on:
  push:
    branches:
      - codex/v181-altered-dominant-resolution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-altered-dominant-resolution
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Diagnostic candidate scores
        run: |
          node <<'NODE'
          Object.assign(globalThis, require('./data.js'));
          Object.assign(globalThis, require('./theory.js'));
          Object.assign(globalThis, require('./chord-resolver.js'));
          for (const notes of [[34,44,50,54,59], [34,44,50,54]]) {
            console.log('NOTES', notes);
            console.log('RAW', padDetectChord(notes, 10).map(c => ({name:c.name, score:c.score, quality:c.quality, chordPCS:c.chordPCS})));
            console.log('RESOLVED', padResolveChordCandidates(notes, 10).map(c => ({name:c.name, score:c.score, resolutionScore:c.resolutionScore, quality:c.quality, completeness:c.resolutionCompleteness, chordPCS:c.chordPCS, unexplained:c.resolutionUnexplainedPCS, unplayed:c.resolutionUnplayedPCS})));
          }
          NODE
      - name: Focused regression
        run: npx vitest run tests/altered-dominant-resolution.test.js
      - name: Full suite
        run: npm test
      - name: Clean diff
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
