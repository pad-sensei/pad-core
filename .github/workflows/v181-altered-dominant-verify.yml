name: Apply and verify v1.8.1 altered dominant resolution

on:
  push:
    branches:
      - codex/v181-altered-dominant-resolution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-altered-dominant-resolution
          fetch-depth: 80
      - name: Apply duplicate-candidate repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('theory.js')
          s = p.read_text()
          old = """    for (var ci = 0; ci < candidates.length; ci++) {
      if (candidates[ci].name === name) {
        candidates[ci].score = Math.max(candidates[ci].score || 0, score);
        if (details) Object.assign(candidates[ci], details);
        return;
      }
    }
"""
          new = """    for (var ci = 0; ci < candidates.length; ci++) {
      if (candidates[ci].name === name) {
        var previousScore = candidates[ci].score || 0;
        var previousTensions = Array.isArray(candidates[ci].tensionLabels) ? candidates[ci].tensionLabels.length : 0;
        var incomingTensions = details && Array.isArray(details.tensionLabels) ? details.tensionLabels.length : 0;
        // A display-derived pc8 role can create the same canonical name before
        // the richer registered b13 entry is visited. Keep the highest-scoring
        // structural realization, and on a tie prefer metadata that actually
        // carries the named tensions. This makes PushOrBump live up to its name.
        if (score > previousScore || (score === previousScore && incomingTensions > previousTensions)) {
          candidates[ci].score = score;
          if (details) Object.assign(candidates[ci], details);
        }
        return;
      }
    }
"""
          if old in s:
            s = s.replace(old, new, 1)
          elif new not in s:
            raise SystemExit('padPushOrBumpCandidate anchor not found')

          old_guard = "if (!seenNames[name]) padPushOrBumpCandidate(name, rootPC, score, padDetectDetails(chord));"
          count = s.count(old_guard)
          if count:
            s = s.replace(old_guard, "padPushOrBumpCandidate(name, rootPC, score, padDetectDetails(chord));")
          elif s.count("padPushOrBumpCandidate(name, rootPC, score, padDetectDetails(chord));") < 2:
            raise SystemExit('exact/omit bump callsites not found')
          p.write_text(s)

          t = Path('tests/altered-dominant-resolution.test.js')
          ts = t.read_text()
          ts = ts.replace("expect(resolved[0].isTopRanked).toBe(true);\n  });", "expect(resolved[0].isTopRanked).toBe(true);\n    expect(resolved[0].quality).toBe('7');\n    expect(resolved[0].tensionLabels).toContain('b13');\n  });", 1)
          t.write_text(ts)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused regression
        run: npx vitest run tests/altered-dominant-resolution.test.js
      - name: Full suite
        run: npm test
      - name: Static checks
        run: |
          git diff --check
          npm audit --omit=dev
      - name: Commit verified repair
        run: |
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add theory.js tests/altered-dominant-resolution.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(theory): preserve canonical altered dominant candidates'
          git push origin HEAD:codex/v181-altered-dominant-resolution
