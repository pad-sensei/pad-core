name: Apply and verify v1.8.1 altered dominant resolution

on:
  push:
    branches:
      - codex/v181-altered-dominant-resolution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-altered-dominant-resolution
          fetch-depth: 80
      - name: Apply duplicate-candidate repair
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused regression
        run: npx vitest run tests/altered-dominant-resolution.test.js
      - name: Full suite
        run: npm test
      - name: Static checks
        run: |
          git diff --check
          npm audit --omit=dev
      - name: Commit verified repair
        run: |
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add theory.js tests/altered-dominant-resolution.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(theory): preserve canonical altered dominant candidates'
          git push origin HEAD:codex/v181-altered-dominant-resolution
