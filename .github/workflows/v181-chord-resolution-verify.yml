name: v1.8.1 chord resolution verify

on:
  push:
    branches:
      - codex/v181-exact-chord-completeness

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused v1.8.1 chord resolver regressions
        run: npx vitest run tests/chord-resolver.test.js tests/pc8-harmonic-semantics.test.js
      - name: Full pad-core suite
        run: npm test
      - name: Diff check
        run: git diff --check 0bb2a661659cee34c5947a0cad8b6a2c84ee7e29 HEAD
